<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Nexo - Solicitar Problema / Sugestão</title>
  
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* VARIABLES & RESET */
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --card-bg: #b0b5bd;
      --card-border: #0000ff;
      --input-bg: #000000;
      --input-text: #ffffff;
      --btn-blue: #0000ff;
      --btn-blue-hover: #0000cc;
      --btn-cyan: #38bdf8;
      --btn-cyan-hover: #0284c7;
      --btn-danger: #dc2626;
      --btn-danger-hover: #b91c1c;
      --text-dark: #111827;
      --shadow-retro: 0 10px 25px -5px rgba(0, 0, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* BARRA SUPERIOR (NOVA SOLICITAÇÃO) */
    .top-bar {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: flex-start;
    }

    .btn-top-bar {
      background-color: var(--btn-blue);
      color: #fff;
      border: 2px solid #000;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.6rem 1.2rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 3px 3px 0px #000;
      transition: transform 0.1s, box-shadow 0.1s;
      text-transform: uppercase;
    }

    .btn-top-bar:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px #000;
    }

    /* LAYOUT DA GRADE */
    .container {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* CARD ESTILO WIREFRAME */
    .retro-card {
      background-color: var(--card-bg);
      border: 8px solid var(--card-border);
      border-radius: 36px;
      padding: 1.8rem 1.5rem;
      color: var(--text-dark);
      box-shadow: var(--shadow-retro);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .retro-title {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 1.6rem;
      text-align: center;
      color: #000;
      letter-spacing: 1px;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      line-height: 1.2;
    }

    /* FORMULÁRIO (ESQUERDA) */
    .form-group {
      display: flex;
      align-items: center;
      margin-bottom: 1rem;
      gap: 10px;
    }

    .form-label {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      color: #000;
      width: 40%;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input, .form-select, .form-textarea {
      width: 60%;
      background-color: var(--input-bg);
      color: var(--input-text);
      border: 2px solid #fff;
      padding: 0.55rem 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      outline: none;
      border-radius: 4px;
    }

    .form-textarea {
      resize: vertical;
      min-height: 60px;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.5);
    }

    .file-input-wrapper {
      width: 60%;
      position: relative;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .file-custom-btn {
      width: 100%;
      background-color: var(--input-bg);
      color: var(--input-text);
      border: 2px solid #fff;
      padding: 0.55rem 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .image-preview {
      margin-top: 5px;
      max-height: 70px;
      border-radius: 4px;
      display: none;
      border: 2px solid #000;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: auto;
      padding-top: 1.2rem;
    }

    .btn-submit {
      background-color: var(--btn-blue);
      color: #fff;
      border: 2px solid #000;
      border-radius: 20px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 0.5rem 1.8rem;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 2px 2px 0px #000;
      transition: all 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--btn-blue-hover);
      transform: scale(1.03);
    }

    /* LISTA DE SOLICITAÇÕES (DIREITA) */
    .requests-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .request-row {
      display: flex;
      border: 3px solid #000;
      background-color: #fff;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .request-row.selected {
      outline: 4px solid var(--btn-blue);
    }

    .request-title-box {
      flex: 1;
      padding: 0.8rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #000;
      text-transform: uppercase;
      border-right: 3px solid #000;
      background-color: #fff;
    }

    .request-action-box {
      width: 40%;
      background-color: var(--btn-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      text-align: center;
      transition: background-color 0.2s;
    }

    .request-row:hover .request-action-box {
      background-color: var(--btn-cyan-hover);
    }

    .btn-details {
      background: none;
      border: none;
      color: #000;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .list-bottom-actions {
      display: flex;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 1rem;
    }

    .btn-bottom {
      background-color: var(--btn-blue);
      color: #fff;
      border: 2px solid #000;
      border-radius: 20px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 0.45rem 1.6rem;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 2px 2px 0px #000;
      transition: all 0.2s;
    }

    .btn-bottom:hover {
      background-color: var(--btn-blue-hover);
      transform: scale(1.03);
    }

    .btn-bottom.btn-delete {
      background-color: var(--btn-blue);
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      color: #4b5563;
    }

    /* TOAST / NOTIFICAÇÃO (RNFO07) */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
    }

    .toast {
      background: #000;
      color: #fff;
      border: 2px solid #38bdf8;
      padding: 0.8rem 1.4rem;
      border-radius: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.3s forwards;
    }

    @keyframes slideIn {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* MODAL DE DETALHES */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: var(--card-bg);
      border: 6px solid var(--card-border);
      border-radius: 24px;
      width: 90%;
      max-width: 550px;
      padding: 1.5rem;
      color: var(--text-dark);
      box-shadow: var(--shadow-retro);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 2px solid #000;
      padding-bottom: 0.5rem;
    }

    .modal-title {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      text-transform: uppercase;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      color: #000;
    }

    .modal-body-item {
      margin-bottom: 0.8rem;
      font-size: 0.95rem;
    }

    .modal-body-item strong {
      font-family: 'Chakra Petch', sans-serif;
      text-transform: uppercase;
      color: #000;
      display: inline-block;
      width: 120px;
    }

    .modal-img {
      max-width: 100%;
      max-height: 180px;
      border-radius: 8px;
      border: 2px solid #000;
      margin-top: 10px;
    }

    .badge-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
      background-color: #fef08a;
      color: #854d0e;
      border: 1px solid #ca8a04;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <div class="top-bar">
    <button class="btn-top-bar" id="btnNewReq">
      <span>+</span> NOVA SOLICITAÇÃO
    </button>
  </div>

  <!-- CONTAINER PRINCIPAL -->
  <div class="container">
    
    <!-- CARD ESQUERDO: FORMULÁRIO -->
    <div class="retro-card">
      <h1 class="retro-title">SOLICITAR<br>PROBLEMA/SUGESTÃO</h1>
      
      <form id="requestForm">
        <div class="form-group">
          <label class="form-label" for="reqTitle">TÍTULO -</label>
          <input type="text" id="reqTitle" class="form-input" required placeholder="Ex: Computador Não Funciona">
        </div>

        <div class="form-group">
          <label class="form-label" for="reqDesc">DESCRIÇÃO -</label>
          <textarea id="reqDesc" class="form-textarea" required placeholder="Descreva os detalhes do problema..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="reqType">TIPO -</label>
          <select id="reqType" class="form-select" required>
            <option value="">Selecione...</option>
            <option value="Problema Hardware">Problema Hardware</option>
            <option value="Problema Software">Problema Software</option>
            <option value="Manutenção">Manutenção</option>
            <option value="Sugestão de Melhoria">Sugestão de Melhoria</option>
            <option value="Outros">Outros</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="reqLocal">LOCAL -</label>
          <input type="text" id="reqLocal" class="form-input" required placeholder="Ex: Sala 203 / Refeitório">
        </div>

        <div class="form-group">
          <label class="form-label" for="reqUrgency">URGÊNCIA -</label>
          <select id="reqUrgency" class="form-select" required>
            <option value="Baixa">Baixa</option>
            <option value="Média" selected>Média (Sugestão)</option>
            <option value="Alta">Alta</option>
            <option value="Crítica">Crítica</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">IMAGEM -<br><span style="font-size:0.75rem; font-weight:normal;">(OPCIONAL)</span></label>
          <div class="file-input-wrapper">
            <label for="reqImage" class="file-custom-btn" id="fileBtnLabel">Escolher arquivo...</label>
            <input type="file" id="reqImage" accept="image/*">
            <img id="imagePreview" class="image-preview" alt="Preview da imagem">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-submit" id="btnSubmit">ENVIAR</button>
        </div>
      </form>
    </div>

    <!-- CARD DIREITO: LISTA -->
    <div class="retro-card">
      <h2 class="retro-title">SOLICITAÇÕES FEITAS</h2>

      <div class="requests-list" id="requestsList">
        <!-- Itens carregados via JS -->
      </div>

      <div class="list-bottom-actions">
        <button class="btn-bottom" id="btnEdit">EDITAR</button>
        <button class="btn-bottom btn-delete" id="btnDelete">EXCLUIR</button>
      </div>
    </div>

  </div>

  <!-- MODAL DE DETALHES -->
  <div class="modal-overlay" id="detailsModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="mTitle">DETALHES DA SOLICITAÇÃO</h3>
        <button class="modal-close" id="btnCloseModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-body-item"><strong>Status:</strong> <span class="badge-status" id="mStatus">Aberto</span></div>
        <div class="modal-body-item"><strong>Tipo:</strong> <span id="mType"></span></div>
        <div class="modal-body-item"><strong>Local:</strong> <span id="mLocal"></span></div>
        <div class="modal-body-item"><strong>Urgência:</strong> <span id="mUrgency"></span></div>
        <div class="modal-body-item"><strong>Data:</strong> <span id="mDate"></span></div>
        <div class="modal-body-item" style="margin-top:10px;"><strong>Descrição:</strong></div>
        <p id="mDesc" style="background:#fff; padding:8px; border:1px solid #000; border-radius:4px; font-size:0.9rem; margin-top:4px; font-family:'JetBrains Mono', monospace;"></p>
        <div id="mImageContainer" style="display:none; margin-top:10px;">
          <strong>Anexo:</strong><br>
          <img id="mImage" class="modal-img" alt="Anexo">
        </div>
      </div>
    </div>
  </div>

  <!-- CONTAINER DE NOTIFICAÇÕES (RNFO07) -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    // ESTADO DA APLICAÇÃO (DADOS INICIAIS BASEADOS NO PROTÓTIPO)
    let requests = [
      {
        id: 1,
        title: "COMPUTADOR NÃO FUNCIONA",
        desc: "O computador da bancada principal não está ligando após a queda de energia de ontem.",
        type: "Problema Hardware",
        local: "Laboratório 01",
        urgency: "Alta",
        status: "Em Aberto",
        date: "07/10/2026 09:15",
        image: null
      },
      {
        id: 2,
        title: "PROJETOR 203 ESTÁ QUEBRADO",
        desc: "A imagem projetada está com feixes de luz amarelos e piscando continuamente.",
        type: "Problema Hardware",
        local: "Sala 203",
        urgency: "Média",
        status: "Em Aberto",
        date: "07/10/2026 10:30",
        image: null
      },
      {
        id: 3,
        title: "MÁQUINA DE CAFÉ NOVA NO REFEITÓRIO",
        desc: "Sugestão de instalação de uma nova máquina de café no 2º andar para evitar filas no refeitório.",
        type: "Sugestão de Melhoria",
        local: "Refeitório Central",
        urgency: "Baixa",
        status: "Em Análise",
        date: "07/10/2026 11:00",
        image: null
      },
      {
        id: 4,
        title: "VAZAMENTO EXTERNO EM BEBEDOURO",
        desc: "Gotejamento contínuo na base do bebedouro próximo ao corredor dos professores.",
        type: "Manutenção",
        local: "Corredor Principal",
        urgency: "Média",
        status: "Em Aberto",
        date: "07/10/2026 13:45",
        image: null
      }
    ];

    let selectedRequestId = null;
    let editingRequestId = null;
    let currentBase64Image = null;

    // ELEMENTOS DO DOM
    const requestForm = document.getElementById('requestForm');
    const reqTitle = document.getElementById('reqTitle');
    const reqDesc = document.getElementById('reqDesc');
    const reqType = document.getElementById('reqType');
    const reqLocal = document.getElementById('reqLocal');
    const reqUrgency = document.getElementById('reqUrgency');
    const reqImage = document.getElementById('reqImage');
    const fileBtnLabel = document.getElementById('fileBtnLabel');
    const imagePreview = document.getElementById('imagePreview');
    const btnSubmit = document.getElementById('btnSubmit');
    const requestsList = document.getElementById('requestsList');

    const btnEdit = document.getElementById('btnEdit');
    const btnDelete = document.getElementById('btnDelete');
    const btnNewReq = document.getElementById('btnNewReq');

    // MODAL
    const detailsModal = document.getElementById('detailsModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const mTitle = document.getElementById('mTitle');
    const mStatus = document.getElementById('mStatus');
    const mType = document.getElementById('mType');
    const mLocal = document.getElementById('mLocal');
    const mUrgency = document.getElementById('mUrgency');
    const mDate = document.getElementById('mDate');
    const mDesc = document.getElementById('mDesc');
    const mImageContainer = document.getElementById('mImageContainer');
    const mImage = document.getElementById('mImage');

    // RENDERIZAR LISTA
    function renderRequests() {
      requestsList.innerHTML = '';
      
      if (requests.length === 0) {
        requestsList.innerHTML = '<div class="empty-state">Nenhuma solicitação cadastrada.</div>';
        return;
      }

      requests.forEach(req => {
        const row = document.createElement('div');
        row.className = `request-row ${selectedRequestId === req.id ? 'selected' : ''}`;
        row.onclick = () => selectRequest(req.id);

        row.innerHTML = `
          <div class="request-title-box">${req.title}</div>
          <div class="request-action-box">
            <button type="button" class="btn-details" onclick="openDetails(event, ${req.id})">VER MAIS<br>DETALHES</button>
          </div>
        `;

        requestsList.appendChild(row);
      });
    }

    // SELECIONAR UM ITEM DA LISTA
    function selectRequest(id) {
      if (selectedRequestId === id) {
        selectedRequestId = null; // Desseleciona se clicar no mesmo
      } else {
        selectedRequestId = id;
      }
      renderRequests();
    }

    // ABRIR MODAL COM DETALHES (RF05 / RF06)
    function openDetails(event, id) {
      event.stopPropagation();
      const req = requests.find(r => r.id === id);
      if (!req) return;

      mTitle.textContent = req.title;
      mStatus.textContent = req.status;
      mType.textContent = req.type;
      mLocal.textContent = req.local;
      mUrgency.textContent = req.urgency;
      mDate.textContent = req.date;
      mDesc.textContent = req.desc;

      if (req.image) {
        mImage.src = req.image;
        mImageContainer.style.display = 'block';
      } else {
        mImageContainer.style.display = 'none';
      }

      detailsModal.classList.add('active');
    }

    // FECHAR MODAL
    btnCloseModal.onclick = () => detailsModal.classList.remove('active');
    detailsModal.onclick = (e) => {
      if (e.target === detailsModal) detailsModal.classList.remove('active');
    };

    // UPLOAD E PREVIEW DE IMAGEM (RF04)
    reqImage.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        fileBtnLabel.textContent = file.name;
        const reader = new FileReader();
        reader.onload = function(event) {
          currentBase64Image = event.target.result;
          imagePreview.src = currentBase64Image;
          imagePreview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      } else {
        resetImageInput();
      }
    });

    function resetImageInput() {
      reqImage.value = '';
      fileBtnLabel.textContent = 'Escolher arquivo...';
      imagePreview.style.display = 'none';
      imagePreview.src = '';
      currentBase64Image = null;
    }

    // MENSAGENS EM LINGUAGEM NATURAL (RNFO07)
    function showToast(message) {
      const toastContainer = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<span>ℹ️</span> <span>${message}</span>`;
      
      toastContainer.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 4000);
    }

    // NOVO REGISTRO / LIMPAR FORMULÁRIO
    function clearForm() {
      editingRequestId = null;
      requestForm.reset();
      resetImageInput();
      btnSubmit.textContent = 'ENVIAR';
    }

    btnNewReq.onclick = () => {
      clearForm();
      showToast('Formulário pronto para uma nova solicitação.');
    };

    // SUBMIT FORM (CRIAR OU EDITAR)
    requestForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const title = reqTitle.value.trim();
      const desc = reqDesc.value.trim();
      const type = reqType.value;
      const local = reqLocal.value.trim();
      const urgency = reqUrgency.value;

      if (!title || !desc || !type || !local) {
        showToast('Por favor, preencha todos os campos obrigatórios.');
        return;
      }

      if (editingRequestId) {
        // MODO EDÇÃO
        const index = requests.findIndex(r => r.id === editingRequestId);
        if (index !== -1) {
          requests[index] = {
            ...requests[index],
            title: title.toUpperCase(),
            desc,
            type,
            local,
            urgency,
            image: currentBase64Image || requests[index].image
          };
          showToast('Solicitação atualizada com sucesso!');
        }
      } else {
        // MODO CRIAÇÃO
        const newReq = {
          id: Date.now(),
          title: title.toUpperCase(),
          desc,
          type,
          local,
          urgency, // RN02: Sugestão do usuário
          status: 'Em Aberto',
          date: new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }),
          image: currentBase64Image
        };
        requests.unshift(newReq);
        showToast('Sua solicitação foi registrada com sucesso!');
      }

      clearForm();
      renderRequests();
    });

    // EDITAR REGISTRO
    btnEdit.onclick = () => {
      if (!selectedRequestId) {
        showToast('Selecione uma solicitação na lista para editar.');
        return;
      }

      const req = requests.find(r => r.id === selectedRequestId);
      if (!req) return;

      editingRequestId = req.id;
      reqTitle.value = req.title;
      reqDesc.value = req.desc;
      reqType.value = req.type;
      reqLocal.value = req.local;
      reqUrgency.value = req.urgency;

      if (req.image) {
        currentBase64Image = req.image;
        imagePreview.src = req.image;
        imagePreview.style.display = 'block';
        fileBtnLabel.textContent = 'Imagem anexada (Alterar)';
      } else {
        resetImageInput();
      }

      btnSubmit.textContent = 'SALVAR';
      showToast(`Editando solicitação: "${req.title}"`);
    };

    // EXCLUIR REGISTRO
    btnDelete.onclick = () => {
      if (!selectedRequestId) {
        showToast('Selecione uma solicitação na lista para excluir.');
        return;
      }

      const req = requests.find(r => r.id === selectedRequestId);
      if (confirm(`Tem certeza que deseja remover a solicitação "${req.title}"?`)) {
        requests = requests.filter(r => r.id !== selectedRequestId);
        selectedRequestId = null;
        if (editingRequestId === selectedRequestId) clearForm();
        renderRequests();
        showToast('Solicitação removida com sucesso.');
      }
    };

    // INICIALIZAÇÃO
    renderRequests();
  </script>
</body>
</html>
